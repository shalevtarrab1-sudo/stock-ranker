<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Ranker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Scrolling view + fixed bottom tab bar; stock detail slides over as a sheet. */
:root {
  --bg: #0B0F16;
  --surface: #131A24;
  --surface-2: #1A2331;
  --line: #243044;
  --fg: #E7ECF4;
  --muted: #8D99AD;
  --faint: #5B687D;
  --accent: #82A0FF;
  --accent-soft: rgba(130, 160, 255, .16);
  --on-accent: #0B0F16;
  --up: #34D399;
  --up-soft: rgba(52, 211, 153, .14);
  --down: #F87171;
  --down-soft: rgba(248, 113, 113, .14);
  --warn: #FBBF24;
  --warn-soft: rgba(251, 191, 36, .14);
  --none: #6B7A90;
  --none-soft: rgba(107, 122, 144, .16);
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --drop: 10px 26px 26px 26px;          /* drop-shaped cards: one tight corner, three round */
  --surface-hi: #18212E;
  --lift: 0 14px 26px -14px rgba(0, 0, 0, .85), 0 3px 8px -2px rgba(0, 0, 0, .45);
  --lift-strong: 0 18px 34px -12px rgba(0, 0, 0, .9), 0 4px 10px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3F5FA; --surface: #FFFFFF; --surface-2: #EBEFF6; --line: #D9E0EB;
    --fg: #0E1624; --muted: #55627A; --faint: #8A96A9;
    --accent: #3B5BDB; --accent-soft: rgba(59, 91, 219, .10); --on-accent: #FFFFFF;
    --up: #047857; --up-soft: rgba(4, 120, 87, .10);
    --down: #C62828; --down-soft: rgba(198, 40, 40, .09);
    --warn: #A15C07; --warn-soft: rgba(161, 92, 7, .10);
    --none: #7A8699; --none-soft: rgba(122, 134, 153, .14);
    --shadow: 0 10px 30px rgba(20, 30, 50, .14);
    --surface-hi: #FFFFFF;
    --lift: 0 14px 26px -16px rgba(25, 40, 80, .35), 0 3px 8px -3px rgba(25, 40, 80, .12);
    --lift-strong: 0 18px 34px -14px rgba(25, 40, 80, .38), 0 4px 10px rgba(25, 40, 80, .10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F3F5FA; --surface: #FFFFFF; --surface-2: #EBEFF6; --line: #D9E0EB;
  --fg: #0E1624; --muted: #55627A; --faint: #8A96A9;
  --accent: #3B5BDB; --accent-soft: rgba(59, 91, 219, .10); --on-accent: #FFFFFF;
  --up: #047857; --up-soft: rgba(4, 120, 87, .10);
  --down: #C62828; --down-soft: rgba(198, 40, 40, .09);
  --warn: #A15C07; --warn-soft: rgba(161, 92, 7, .10);
  --none: #7A8699; --none-soft: rgba(122, 134, 153, .14);
  --shadow: 0 10px 30px rgba(20, 30, 50, .14);
  --surface-hi: #FFFFFF;
  --lift: 0 14px 26px -16px rgba(25, 40, 80, .35), 0 3px 8px -3px rgba(25, 40, 80, .12);
  --lift-strong: 0 18px 34px -14px rgba(25, 40, 80, .38), 0 4px 10px rgba(25, 40, 80, .10);
  color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

#app { position: relative; height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--bg); }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; }

/* App bar */
.appbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.asof { font-size: 12px; color: var(--muted); text-align: right; }
.h2 { font-family: var(--f-display); font-weight: 600; font-size: 17px; margin: 22px 0 10px; text-wrap: balance; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Tab bar */
.tabs { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .02em; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); }

/* Buttons and chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 13px; font-weight: 500; }
.chip .x { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.chip .x svg { width: 14px; height: 14px; }
.chip.add { padding: 0 12px; color: var(--muted); border-style: dashed; }
.chip.add b { color: var(--fg); font-weight: 500; }
.chip.add[aria-pressed="true"] { opacity: .4; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.field { display: flex; gap: 8px; }
.input { flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-family: var(--f-mono); font-size: 16px; text-transform: uppercase; }
.input::placeholder { text-transform: none; font-family: var(--f-body); color: var(--faint); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.err { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--down-soft); color: var(--down); font-size: 14px; }
.note { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 13.5px; }

/* Ranking list */
.rank-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 6px 0 10px; }
.rank-head .eyebrow { margin-bottom: 2px; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.row:active { background: var(--surface-2); }
.row .rk { font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--muted); text-align: center; }
.row.top .rk { color: var(--accent); }
.row .mid { display: block; min-width: 0; overflow: hidden; }
.row .tk { display: flex; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.row .sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { display: block; position: relative; height: 4px; border-radius: 4px; background: var(--surface-2); margin-top: 7px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
.row .sc { text-align: right; }
.row .sc .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 600; }
.row .sc .p { font-size: 11.5px; color: var(--muted); font-family: var(--f-mono); }
.tag { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; font-family: var(--f-body); }
.tag.down { background: var(--down-soft); color: var(--down); }
.tag.up { background: var(--up-soft); color: var(--up); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.none { background: var(--none-soft); color: var(--none); }
.tag.acc { background: var(--accent-soft); color: var(--accent); }
.delta { font-family: var(--f-mono); font-size: 12px; font-weight: 600; min-width: 34px; display: inline-block; text-align: right; }
.delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.same { color: var(--faint); }

/* Busy */
.busy { margin-top: 16px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } .sheet { transition: none !important; } }

/* Simulate */
.simbar { position: sticky; top: 0; z-index: 6; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.simbar-top { display: flex; align-items: center; gap: 8px; }
.sum { flex: 1; min-width: 0; }
.sum .big { font-family: var(--f-mono); font-weight: 600; font-size: 18px; }
.sum .big.bad { color: var(--down); }
.sum .small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { position: relative; width: 44px; height: 40px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:disabled { opacity: .35; }
.icon-btn.play { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.icon-btn.play svg { width: 18px; height: 18px; }
.icon-btn .badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font: 600 10.5px/18px var(--f-mono); }
.movers { display: flex; gap: 6px; margin-top: 9px; overflow-x: auto; scrollbar-width: none; }
.movers::-webkit-scrollbar { display: none; }
.mover { flex: none; display: inline-flex; gap: 5px; align-items: center; height: 26px; padding: 0 9px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; font-family: var(--f-mono); }
.mover b { font-family: var(--f-display); font-weight: 600; }

.radar-card { margin-top: 14px; padding: 8px 4px 4px; }
.radar { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.radar .ring { fill: none; stroke: var(--line); stroke-width: 1; }
.radar .axis { stroke: var(--line); stroke-width: 1; }
.radar .ringlbl { fill: var(--faint); font: 500 9px var(--f-mono); }
.radar .ghost { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: .8; }
.radar .poly { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.radar .handle { fill: var(--bg); stroke: var(--accent); stroke-width: 2.5; }
.radar .handle.locked { stroke: var(--faint); }
.radar .hit { fill: transparent; cursor: grab; }
.radar .lbl { fill: var(--fg); font: 600 11.5px var(--f-body); }
.radar .val { fill: var(--muted); font: 500 11px var(--f-mono); }
.radar .val.chg { fill: var(--accent); }
.radar-help { font-size: 12px; color: var(--muted); text-align: center; padding: 2px 12px 10px; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-top: 14px; }
.seg button { height: 36px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }

.toolrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 6px; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 500; }
.switch input { appearance: none; -webkit-appearance: none; width: 42px; height: 26px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line); position: relative; margin: 0; cursor: pointer; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.switch input:checked { background: var(--accent); border-color: transparent; }
.switch input:checked::after { transform: translateX(16px); background: var(--on-accent); }

.group { margin-top: 14px; }
.group-h { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 6px; }
.group-h .t { font-family: var(--f-display); font-weight: 600; font-size: 14.5px; }
.group-h .s { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.wrow { padding: 10px 10px 12px; border-top: 1px solid var(--line); }
.wrow:first-of-type { border-top: 0; }
.wrow-top { display: flex; align-items: center; gap: 6px; }
.wrow .lk { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); flex: none; }
.wrow .lk svg { width: 16px; height: 16px; }
.wrow .lk[aria-pressed="true"] { color: var(--warn); background: var(--warn-soft); }
.wrow .nm { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrow .wv { font-family: var(--f-mono); font-size: 13.5px; font-weight: 600; min-width: 48px; text-align: right; }
.wrow .wv.chg { color: var(--accent); }
.step { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); flex: none; }
.step svg { width: 14px; height: 14px; }
.track { position: relative; height: 26px; margin: 4px 0 0 36px; touch-action: pan-y; cursor: ew-resize; }
.track .rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 4px; background: var(--surface-2); }
.track .fill { position: absolute; left: 0; top: 11px; height: 4px; border-radius: 4px; background: var(--accent); }
.track .def { position: absolute; top: 6px; width: 2px; height: 14px; background: var(--muted); border-radius: 1px; opacity: .7; }
.track .knob { position: absolute; top: 4px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--accent); }
.wrow.locked .fill { background: var(--faint); } .wrow.locked .knob { border-color: var(--faint); } .wrow.locked .track { cursor: not-allowed; }

.pen-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
.pen-row:first-child { border-top: 0; }
.pen-row .t { flex: 1; min-width: 0; font-size: 13.5px; }
.pen-row .t small { display: block; color: var(--muted); font-size: 11.5px; }
.pen-row .m { font-family: var(--f-mono); font-size: 13px; color: var(--muted); min-width: 44px; text-align: right; }
.slider { width: 100%; accent-color: var(--accent); height: 28px; }

/* Detail sheet */
.sheet { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s ease; visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.sheet-bar { display: flex; align-items: center; gap: 6px; padding-block: 10px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.sheet-bar .back { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.sheet-bar .back svg { width: 22px; height: 22px; }
.sheet-bar .ttl { flex: 1; min-width: 0; }
.sheet-bar .ttl b { font-family: var(--f-display); font-size: 18px; }
.sheet-bar .ttl div { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat { padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.stat .k { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.stat .v { font-family: var(--f-mono); font-weight: 600; font-size: 22px; margin-top: 2px; white-space: nowrap; }
.stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.build { padding: 4px 12px; }
.brow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.brow:first-child { border-top: 0; }
.brow .n { font-size: 13.5px; }
.brow .pts { font-family: var(--f-mono); font-size: 13px; text-align: right; }
.brow .pts span { color: var(--muted); }
.brow .bar { grid-column: 1 / -1; margin-top: 2px; }
.brow.total .n, .brow.total .pts { font-weight: 600; }
.brow.pen .pts { color: var(--down); }
.slist { display: flex; flex-direction: column; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow .n { font-size: 14px; min-width: 0; }
.srow .v { font-family: var(--f-mono); font-size: 14px; font-weight: 600; text-align: right; }
.srow .sp { font-size: 12px; color: var(--muted); }
.srow .rel { font-size: 11.5px; color: var(--muted); text-align: right; font-family: var(--f-mono); }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 20px 0 8px; }
.sec-h .h { font-family: var(--f-display); font-weight: 600; font-size: 15.5px; }
.sec-h .dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.up { background: var(--up); } .dot.down { background: var(--down); } .dot.warn { background: var(--warn); } .dot.none { background: var(--none); } .dot.acc { background: var(--accent); }
details.more summary { list-style: none; cursor: pointer; padding: 11px 12px; font-size: 13.5px; color: var(--muted); display: flex; justify-content: space-between; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] summary { border-bottom: 1px solid var(--line); }
.cond { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13.5px; }
.cond:first-child { border-top: 0; }
.cond svg { width: 18px; height: 18px; flex: none; }
.cond.on svg { color: var(--up); } .cond.off svg { color: var(--faint); }
.cond .w { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Lock */
.lock { min-height: 100%; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.lock-card { width: 100%; max-width: 360px; padding: 26px 22px; }
.lock-card .brand { font-size: 24px; margin-bottom: 4px; }
.lock-card p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.lock-card .input { text-transform: none; letter-spacing: .1em; width: 100%; margin-bottom: 10px; }

/* Footer */
.foot { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.foot-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.foot .who { font-family: var(--f-display); font-weight: 600; font-size: 14px; }

/* integer rescale with largest remainder: give `idx` a combined total of `target` */

    const ta = document.createElement('textarea'); ta.className = 'copy'; ta.value = txt; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); ok ? done() : toast('Copy is blocked here. Long-press to select instead.');
  };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
}

/* Ranking */
function rankRow(r, maxScore, opts) {
  const s = r.s;

  const sub = s.noData ? (s.error ? 'Yahoo returned no data' : 'Most data missing') : [s.sector, s.industry].filter(Boolean).join(' · ') || (s.name || '');
  const delta = opts && opts.delta != null ? (opts.delta > 0 ? '<span class="delta up">▲' + opts.delta + '</span>' : opts.delta < 0 ? '<span class="delta down">▼' + (-opts.delta) + '</span>' : '<span class="delta same">–</span>') : '';
  const right = '<div class="sc"><div class="v">' + r.score.toFixed(1) + '</div>' + (opts && opts.was ? '<div class="p">was #' + opts.was + '</div>' : '') + '</div>';
  return '<button class="row' + (r.rank <= 3 ? ' top' : '') + '" data-open="' + esc(s.t) + '" data-model="' + (opts && opts.model || 'default') + '">' +
    '<span class="rk">' + r.rank + '</span>' +

    '<span class="bar"><i style="width:' + Math.max(0, Math.min(100, r.score / maxScore * 100)).toFixed(1) + '%"></i></span></span>' +
    right + '</button>';
}
function rankingView() {
  if (!S.payload) return appbar('') + '<div class="card empty" style="margin-top:20px"><b>No ranking yet</b></div><button class="btn primary block" style="margin-top:14px" data-tab-go="symbols">' + ICON.list + 'Choose symbols</button>';

function mailText(rows, am) {

/* Simulate */
function simulateView() {
  const sim = S.sim, tot = sum(sim.w), ok = tot === TOTAL;
  const base = evaluate(null), cur = ok && S.payload ? evaluate(sim) : null;
  const was = new Map(base.map(r => [r.s.t, r.rank]));
  let movers = '';
  if (!S.payload) movers = '<span class="mover">Run symbols to see the effect</span>';
  else if (cur) {
    const changed = cur.map(r => ({ t: r.s.t, d: was.get(r.s.t) - r.rank, r: r.rank })).filter(x => x.d !== 0).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    movers = changed.length ? changed.slice(0, 12).map(x => '<span class="mover"><b>' + esc(x.t) + '</b>#' + x.r + '<span class="delta ' + (x.d > 0 ? 'up' : 'down') + '" style="min-width:0">' + (x.d > 0 ? '▲' : '▼') + Math.abs(x.d) + '</span></span>').join('') : '<span class="mover">Same order as default</span>';
  } else movers = '<span class="mover" style="color:var(--down)">Fix the total under 29 weights</span>';
  const changedCount = cur ? cur.filter(r => was.get(r.s.t) !== r.rank).length : 0;
  const pdef = isDefaultPenalty();
  const head = !S.payload ? (isDefaultWeights() && pdef ? 'Default' : 'Custom weights') : ok ? (isDefaultWeights() && pdef ? 'Default' : changedCount + ' rank change' + (changedCount === 1 ? '' : 's')) : (tot < TOTAL ? pct(TOTAL - tot) + ' missing' : pct(tot - TOTAL) + ' too much');
  const sub = ok ? (sameAsApplied() ? (appliedModel() ? 'In use on Ranking' : 'Ranking uses default') : 'Tap ▶ to use on Ranking') : 'Weights do not add up';

  const bar =
    '<div class="simbar"><div class="simbar-top">' +
    '<div class="sum"><div class="big' + (ok ? '' : ' bad') + '" style="font-family:var(--f-display)">' + esc(head) + '</div><div class="small">' + esc(sub) + '</div></div>' +
    '<button class="icon-btn" data-act="undo" aria-label="Undo last change" title="Undo last change"' + (S.undo.length ? '' : ' disabled') + '>' + ICON.undo + (S.undo.length ? '<span class="badge">' + S.undo.length + '</span>' : '') + '</button>' +
    '<button class="icon-btn" data-act="default" aria-label="Back to default weights" title="Back to default weights"' + (isDefaultWeights() && pdef ? ' disabled' : '') + '>' + ICON.reset + '</button>' +
    '<button class="icon-btn play" data-act="apply" aria-label="Use these weights on Ranking" title="Use these weights on Ranking"' + (ok && !sameAsApplied() ? '' : ' disabled') + '>' + ICON.play + '</button>' +
    '</div><div class="movers">' + movers + '</div></div>';

  let panel = '';
  if (S.panel === 'results') panel = resultsPanel(cur, was);
  else if (S.panel === 'weights') panel = weightsPanel();
  else panel = penaltyPanel();

  return bar +
    '<div class="card radar-card">' + radarSvg() + '<div class="radar-help">Drag a dot · dashed = default</div></div>' +
    '<div class="seg" role="tablist">' +
    ['weights', 'penalties', 'results'].map(p => '<button role="tab" data-panel="' + p + '" aria-selected="' + (S.panel === p) + '">' + { results: 'vs Default', weights: '29 weights', penalties: 'Penalties' }[p] + '</button>').join('') +
    '</div>' + panel;
}

function resultsPanel(cur, was) {
  if (!S.payload) return '<div class="card empty" style="margin-top:12px"><b>No run yet</b></div><button class="btn primary block" style="margin-top:12px" data-tab-go="symbols">' + ICON.list + 'Choose symbols</button>';
  if (!cur) return '<div class="err">The 29 weights add up to ' + pct(sum(S.sim.w)) + '. Bring them to 96.0% (or switch on auto-balance under 29 weights) to see the simulated ranking.</div>';
  const max = Math.max(1, cur.length ? cur[0].score : 1);
  return '<div class="rows" style="margin-top:12px">' + cur.map(r => rankRow(r, max, { model: 'sim', delta: was.get(r.s.t) - r.rank, was: was.get(r.s.t) })).join('') + '</div>';
}

function radarSvg() {
  const W = 360, H = 330, cx = W / 2, cy = 168, R = RADAR_R, n = M.cats.length;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => { const r = R * Math.min(v, RADAR_MAX) / RADAR_MAX; return [cx + r * Math.cos(ang(i)), cy + r * Math.sin(ang(i))]; };
  let g = '';
  [100, 200, 300].forEach(v => {
    const ps = M.cats.map((_, i) => pt(i, v).map(x => x.toFixed(1)).join(',')).join(' ');
    g += '<polygon class="ring" points="' + ps + '"/>';
    const rr = R * v / RADAR_MAX;
    g += '<text class="ringlbl" x="' + (cx + rr * 0.3827 + 3).toFixed(1) + '" y="' + (cy - rr * 0.9239 + 3).toFixed(1) + '">' + (v / 10) + '%</text>';
  });
  M.cats.forEach((_, i) => { const p = pt(i, RADAR_MAX); g += '<line class="axis" x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '"/>'; });
  g += '<polygon class="ghost" points="' + M.cats.map((c, i) => pt(i, c.def).map(x => x.toFixed(1)).join(',')).join(' ') + '"/>';
  g += '<polygon class="poly" id="rpoly" points="' + M.cats.map((c, i) => pt(i, catTotal(c, S.sim.w)).map(x => x.toFixed(1)).join(',')).join(' ') + '"/>';
  M.cats.forEach((c, i) => {
    const v = catTotal(c, S.sim.w), p = pt(i, v), lp = pt(i, RADAR_MAX * 1.2);
    const a = Math.cos(ang(i)), anchor = Math.abs(a) < 0.2 ? 'middle' : a > 0 ? 'start' : 'end';
    const allLocked = c.idx.every(j => S.sim.locks[j]);
    const yOff = Math.sin(ang(i)) < -0.5 ? -8 : Math.sin(ang(i)) > 0.5 ? 6 : 0;
    g += '<text class="lbl" x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + yOff).toFixed(1) + '" text-anchor="' + anchor + '">' + esc(c.label) + '</text>';
    g += '<text class="val' + (v !== c.def ? ' chg' : '') + '" data-cval="' + i + '" x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + yOff + 14).toFixed(1) + '" text-anchor="' + anchor + '">' + pct(v) + '</text>';
    g += '<circle class="handle' + (allLocked ? ' locked' : '') + '" data-h="' + i + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="7"/>';
    g += '<circle class="hit" data-cat="' + i + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="22"/>';
  });
  return '<svg class="radar" id="radar" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weight by group">' + g + '</svg>';
}

function weightsPanel() {
  const sim = S.sim;
  let html = '<div class="toolrow"><label class="switch"><input type="checkbox" id="auto"' + (sim.auto ? ' checked' : '') + '>Auto-balance</label>' +
    '<button class="btn sm" data-act="copy">' + ICON.copy + 'Copy as Python</button></div>' +
    (sim.auto ? '' : '<div class="hint" style="margin-top:0">Total now ' + pct(sum(sim.w)) + ' (needs 96.0%).</div>');
  M.cats.forEach(c => {
    const t = catTotal(c, sim.w);
    html += '<div class="group"><div class="group-h"><span class="t">' + esc(c.label) + '</span><span class="s">' + pct(t) + (t !== c.def ? ' <span class="muted">· default ' + pct(c.def) + '</span>' : '') + '</span></div><div class="card">';
    c.idx.forEach(i => { html += weightRow(i); });
    html += '</div></div>';
  });
  return html;
}
function weightRow(i) {
  const m = M.metrics[i], v = S.sim.w[i], locked = S.sim.locks[i];
  const fillPct = Math.min(100, v / BAR_MAX * 100), defPct = Math.min(100, m.wDef / BAR_MAX * 100);
  return '<div class="wrow' + (locked ? ' locked' : '') + '" data-row="' + i + '">' +
    '<div class="wrow-top"><button class="lk" data-lock="' + i + '" aria-pressed="' + locked + '" aria-label="' + (locked ? 'Unlock ' : 'Lock ') + esc(m.label) + '">' + (locked ? ICON.lock : ICON.unlock) + '</button>' +
    '<span class="nm">' + esc(m.label) + '</span>' +
    '<button class="step" data-step="-1" data-i="' + i + '" aria-label="Decrease ' + esc(m.label) + '"' + (locked ? ' disabled' : '') + '>' + ICON.minus + '</button>' +
    '<span class="wv' + (v !== m.wDef ? ' chg' : '') + '" data-wv="' + i + '">' + pct(v) + '</span>' +
    '<button class="step" data-step="1" data-i="' + i + '" aria-label="Increase ' + esc(m.label) + '"' + (locked ? ' disabled' : '') + '>' + ICON.plus + '</button></div>' +
    '<div class="track" data-track="' + i + '"><div class="rail"></div><div class="fill" style="width:' + fillPct.toFixed(1) + '%"></div><div class="def" style="left:' + defPct.toFixed(1) + '%"></div><div class="knob" style="left:' + fillPct.toFixed(1) + '%"></div></div>' +
    '</div>';
}

function penaltyPanel() {
  const sim = S.sim, stocks = S.payload ? S.payload.stocks : [];
  const hasResidual = stocks.some(s => s.residual !== 1);
  let html = '<div class="card" style="padding:12px 14px;margin-top:14px"><div class="toolrow" style="margin:0"><b style="font-size:14px">Penalty strength</b><span class="num" id="kval">' + sim.k + '%</span></div>' +
    '<input class="slider" type="range" id="kslider" min="0" max="100" step="5" value="' + sim.k + '" aria-label="Penalty strength">' +
    '<div class="hint" style="margin-top:2px">100% = notebook · 50%: ×0.6 acts as ×0.8 · 0% = off</div></div>' +
    '<div class="card" style="margin-top:10px">';
  M.rules.forEach((r, j) => {
    const n = stocks.filter(s => s.hits[j]).length;
    html += '<div class="pen-row"><div class="t">' + esc(r.label) + (stocks.length ? '<small>' + (n ? 'Hits ' + n + ' of ' + stocks.length : 'Hits none') + '</small>' : '') + '</div><span class="m">×' + r.mult + '</span>' +
      '<label class="switch"><input type="checkbox" data-rule="' + j + '"' + (sim.on[j] ? ' checked' : '') + ' aria-label="' + esc(r.label) + '"></label></div>';
  });
  html += '</div>';
  if (hasResidual) html += '<div class="hint">Preview: momentum rules are not in the Excel; their combined factor follows the slider.</div>';
  return html;
}

/* Detail */
function detailView() {
  const d = S.detail, sim = d.model === 'sim' ? S.sim : d.model === 'applied' ? appliedModel() : null;
  const ok = sim && sum(sim.w) === TOTAL;
  const rows = evaluate(ok ? sim : null);
  const r = rows.find(x => x.s.t === d.t);
  if (!r) return '';
  const s = r.s, w = (ok ? sim.w : M.wDef).map(x => x / 1000);
  const name = [s.name, s.sector, s.industry].filter(Boolean).join(' · ');
  const modelLbl = ok && !isDefaultModel(sim) ? (d.model === 'applied' ? 'Your weights' : 'Simulated weights') : 'Default weights';

  // score build-up by group
  let build = '';
  let rawSum = 0;
  M.cats.forEach(c => {
    let earned = 0, possible = 0;
    c.idx.forEach(i => { earned += s.norm[i] * w[i] * 100; possible += w[i] * 100; });
    if (c.idx.indexOf(M.ptt) >= 0) { earned += s.norm[M.ptt] * M.pttExtra * 100; possible += M.pttExtra * 100; }
    rawSum += earned;
    build += '<div class="brow"><span class="n">' + esc(c.label) + '</span><span class="pts">' + earned.toFixed(1) + ' <span>/ ' + possible.toFixed(1) + '</span></span><span class="bar"><i style="width:' + (possible > 0 ? earned / possible * 100 : 0).toFixed(1) + '%"></i></span></div>';
  });
  const bullPts = s.bull * M.bw * 100; rawSum += bullPts;
  build += '<div class="brow"><span class="n">Momentum <span class="muted" style="font-size:12px">(fixed 4%)</span></span><span class="pts">' + bullPts.toFixed(1) + ' <span>/ 4.0</span></span><span class="bar"><i style="width:' + (s.bull * 100).toFixed(1) + '%"></i></span></div>';
  build += '<div class="brow total"><span class="n">Before penalty</span><span class="pts">' + (r.raw * 100).toFixed(1) + ' <span>/ 102</span></span></div>';
  if (r.pen < 1) build += '<div class="brow pen"><span class="n">Penalty ×' + r.pen.toFixed(3) + '</span><span class="pts">−' + (r.raw * 100 - r.score).toFixed(1) + '</span></div>';
  build += '<div class="brow total"><span class="n">Score</span><span class="pts">' + r.score.toFixed(2) + '</span></div>';

  // SPEC lists
  const groups = { exceptional: [], fail: [], outside: [], nodata: [], pass: [] };
  M.metrics.forEach((m, i) => { groups[s.status[i]].push(i); });
  const sRow = i => {
    const m = M.metrics[i];
    return '<div class="srow"><span class="n">' + esc(m.label) + '</span><span class="v">' + fmt(s.raw[i], m.fmt) + '</span>' +
      '<span class="sp">SPEC ' + esc(m.spec) + ' · weight ' + pct(Math.round(w[i] * 1000)) + '</span><span class="rel">' + (s.raw[i] == null ? 'scored 0' : 'vs list ' + Math.round(s.norm[i] * 100) + '/100') + '</span></div>';
  };
  const section = (key, title, hint) => groups[key].length ? '<div class="sec-h"><span class="dot ' + STATUS[key].cls + '"></span><span class="h">' + title + ' · ' + groups[key].length + '</span></div>' + (hint ? '<div class="hint" style="margin:-4px 0 8px">' + hint + '</div>' : '') + '<div class="card slist">' + groups[key].sort((a, b) => w[b] - w[a]).map(sRow).join('') + '</div>' : '';
  const bad = section('fail', 'Out of spec', null) +
    section('outside', 'Outside the range', 'Outside a min–max SPEC on the side the score still rewards.') +
    section('nodata', 'No data', 'Missing from Yahoo; scored as 0.');
  let spec = section('exceptional', 'Strong vs SPEC', 'Beats the threshold by ' + M.factor + '× or more.');
  if (groups.pass.length) spec += '<details class="more card" style="margin-top:10px"><summary><span>In spec · ' + groups.pass.length + '</span><span>Show</span></summary><div class="slist">' + groups.pass.sort((a, b) => w[b] - w[a]).map(sRow).join('') + '</div></details>';

  // penalties
  const hits = M.rules.map((rr, j) => ({ rr: rr, j: j })).filter(x => s.hits[x.j]);
  let pen = '';
  if (hits.length || s.residual !== 1) {
    pen = '<div class="card slist">' + hits.map(x => {
      const off = sim && !sim.on[x.j];
      return '<div class="srow"><span class="n">' + esc(x.rr.label) + '</span><span class="v" style="color:var(' + (off ? '--faint' : '--down') + ')">×' + x.rr.mult + '</span>' + (off ? '<span class="sp">Switched off in the simulator</span>' : '') + '</div>';
    }).join('') + (s.residual !== 1 ? '<div class="srow"><span class="n">Momentum and trend rules <span class="muted">(not in Excel)</span></span><span class="v" style="color:var(--down)">×' + s.residual.toFixed(3) + '</span></div>' : '') + '</div>';
  } else pen = '<div class="card empty" style="padding:16px">No penalty rules hit.</div>';

  // momentum
  let mom = '';
  if (s.conds) {
    mom = '<div class="card">' + M.conds.map((c, j) => '<div class="cond ' + (s.conds[j] ? 'on' : 'off') + '">' + (s.conds[j] ? ICON.check : ICON.dash) + '<span>' + esc(c.label) + '</span><span class="w">' + Math.round(c.weight * 100) + '%</span></div>').join('') + '</div>';
  } else {
    mom = '<div class="card" style="padding:12px 14px;font-size:13.5px">Momentum score ' + Math.round(s.bull * 100) + '/100 (from the notebook). The individual conditions are not in the Excel; the live app shows each one.</div>';
  }

  const total = rows.length;
  return '<div class="sheet-bar"><button class="back" data-act="close" aria-label="Back">' + ICON.back + '</button>' +
    '<div class="ttl"><b>' + esc(s.t) + '</b><div>' + esc(name || '—') + '</div></div><span class="tag acc">' + modelLbl + '</span></div>' +
    '<div class="view"><div class="wrap">' +
    (s.noData ? '<div class="err">' + (s.error ? 'Yahoo Finance returned no data for this symbol (' + esc(s.error) + '). ' : 'Most data is missing for this symbol. ') + 'Check the spelling; missing metrics count as 0.</div>' : '') +
    '<div class="stats"><div class="stat"><div class="k">Rank</div><div class="v">#' + r.rank + ' <small>/ ' + total + '</small></div></div>' +
    '<div class="stat"><div class="k">Score</div><div class="v">' + r.score.toFixed(1) + '</div></div>' +
    '<div class="stat"><div class="k">Penalty</div><div class="v" style="color:var(' + (r.pen < 1 ? '--down' : '--fg') + ')">×' + r.pen.toFixed(2) + '</div></div></div>' +
    (bad || '<div class="card empty" style="margin-top:14px;padding:16px">Nothing out of spec.</div>') +
    '<div class="sec-h"><span class="dot down"></span><span class="h">Penalties</span></div>' + pen +
    spec +
    '<div class="sec-h"><span class="dot acc"></span><span class="h">Momentum</span></div>' + mom +
    '<div class="sec-h"><span class="dot acc"></span><span class="h">Summary: where the points come from</span></div>' +
    '<div class="hint" style="margin:-4px 0 8px">Points earned / possible per group. Max 102 before penalty (Price to target counts twice).</div>' +
    '<div class="card build">' + build + '</div>' +
    footer() + '</div></div>';
}

/* ---------- events ---------- */
function bind() {
  app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { if (b.classList.contains('tab')) { S.tab = b.dataset.tab; S.detail = null; render(); } }));
  app.querySelectorAll('[data-tab-go]').forEach(b => b.addEventListener('click', () => { S.tab = b.dataset.tabGo; render(); }));
  app.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { S.detail = { t: b.dataset.open, model: b.dataset.model }; render(); const v = app.querySelector('.sheet .view'); if (v) v.scrollTop = 0; }));
  app.querySelectorAll('[data-pf]').forEach(b => b.addEventListener('click', () => { S.penFilter = S.penFilter === b.dataset.pf ? null : b.dataset.pf; render(); }));
  app.querySelectorAll('[data-panel]').forEach(b => b.addEventListener('click', () => { S.panel = b.dataset.panel; render(); }));
  app.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => removeTicker(b.dataset.rm)));
  app.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { addTickers(b.dataset.add); render(); }));
  app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act)));

  const f = document.getElementById('addForm');
  if (f) {
    const inp = document.getElementById('tick');
    inp.addEventListener('input', () => { S.draft = inp.value; if (/[\s,;]$/.test(inp.value) && inp.value.trim()) { addTickers(inp.value); S.draft = ''; render(); const n = document.getElementById('tick'); if (n) n.focus(); } });
    f.addEventListener('submit', e => { e.preventDefault(); if (inp.value.trim()) { addTickers(inp.value); S.draft = ''; render(); const n = document.getElementById('tick'); if (n) n.focus(); } });
  }
  const auto = document.getElementById('auto');
  if (auto) auto.addEventListener('change', () => { const b = snapshot(); S.sim.auto = auto.checked; commit(b); render(); });
  const ks = document.getElementById('kslider');
  if (ks) {
    let before = null;
    ks.addEventListener('pointerdown', () => { before = snapshot(); });
    ks.addEventListener('input', () => { if (before == null) before = snapshot(); S.sim.k = +ks.value; const kv = document.getElementById('kval'); if (kv) kv.textContent = ks.value + '%'; });
    ks.addEventListener('change', () => { commit(before || snapshot()); before = null; render(); });
  }
  app.querySelectorAll('[data-rule]').forEach(cb => cb.addEventListener('change', () => { const b = snapshot(); S.sim.on[+cb.dataset.rule] = cb.checked; commit(b); render(); }));
  app.querySelectorAll('[data-lock]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.lock, bf = snapshot(); S.sim.locks[i] = !S.sim.locks[i]; commit(bf); render(); }));
  app.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i, bf = snapshot();
    setWeight(i, S.sim.w[i] + (+b.dataset.step)); commit(bf); render();
  }));
  app.querySelectorAll('[data-track]').forEach(bindTrack);
  const radar = document.getElementById('radar');
  if (radar) bindRadar(radar);
}

function act(a) {
  if (a === 'run') run();
  else if (a === 'clear') { S.tickers = []; saveTickers(); render(); }
  else if (a === 'clearhist') { S.history = []; store.set('history', []); render(); }
  else if (a === 'undo') undo();
  else if (a === 'default') { const b = snapshot(); const locks = S.sim.locks.map(() => false); Object.assign(S.sim, { w: M.wDef.slice(), k: 100, on: M.rules.map(() => true), locks: locks }); commit(b); render(); toast('Back to your default weights'); }
  else if (a === 'copy') copyPython();
  else if (a === 'apply') { if (!weightsValid()) return; S.applied = isDefaultModel(S.sim) ? null : { w: S.sim.w.slice(), k: S.sim.k, on: S.sim.on.slice() }; store.set('applied', S.applied); S.tab = S.payload ? 'ranking' : 'symbols'; S.detail = null; scrollMemo.ranking = 0; render(); toast(S.applied ? 'Ranking now uses your weights' : 'Ranking uses default weights'); }
  else if (a === 'mail') { if (!S.payload || S.mailBusy) return; const am = appliedModel(); const m = mailText(evaluate(am), am); S.mailBusy = true; S.pendingId = newId(); ST.value({ type: 'mail', id: S.pendingId, subject: m.subject, body: m.body }); render(); }
  else if (a === 'unapply') { S.applied = null; store.set('applied', null); render(); toast('Ranking back to default weights'); }
  else if (a === 'close') { S.detail = null; render(); }
}

/* live drag: update only the pieces that move, re-render on release */
function liveRefresh() {
  // sum + movers + radar + rows are cheap enough to rebuild together
  const view = app.querySelector('.view');
  const top = view ? view.scrollTop : 0;
  const simbar = app.querySelector('.simbar');
  const radarCard = app.querySelector('.radar-card');
  if (!simbar || !radarCard) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = simulateView();
  simbar.replaceWith(tmp.querySelector('.simbar'));
  const newRadar = tmp.querySelector('.radar');
  const oldRadar = radarCard.querySelector('.radar');
  // keep the radar element under the finger; copy its children instead
  oldRadar.innerHTML = newRadar.innerHTML;
  const oldRows = app.querySelector('.rows'); const newRows = tmp.querySelector('.rows');
  if (oldRows && newRows) oldRows.innerHTML = newRows.innerHTML;
  app.querySelectorAll('[data-row]').forEach(row => {
    const i = +row.dataset.row, v = S.sim.w[i], m = M.metrics[i];
    const fp = Math.min(100, v / BAR_MAX * 100).toFixed(1) + '%';
    row.querySelector('.fill').style.width = fp; row.querySelector('.knob').style.left = fp;
    const wv = row.querySelector('.wv'); wv.textContent = pct(v); wv.classList.toggle('chg', v !== m.wDef);
  });
  app.querySelectorAll('.group').forEach((g, n) => {
    const c = M.cats[n]; if (!c) return; const t = catTotal(c, S.sim.w);
    g.querySelector('.group-h .s').innerHTML = pct(t) + (t !== c.def ? ' <span class="muted">· default ' + pct(c.def) + '</span>' : '');
  });
  if (view) view.scrollTop = top;
  app.querySelector('.simbar').querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act)));
}

function bindTrack(tr) {
  const i = +tr.dataset.track;
  let before = null, startX = 0, startY = 0, dragging = false, pid = null;
  const valueAt = x => { const rc = tr.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - rc.left) / rc.width)) * BAR_MAX; };
  tr.addEventListener('pointerdown', e => {
    if (S.sim.locks[i]) { toast('Unlock this weight to change it'); return; }
    before = snapshot(); startX = e.clientX; startY = e.clientY; dragging = false; pid = e.pointerId;
  });
  tr.addEventListener('pointermove', e => {
    if (before == null || e.pointerId !== pid) return;
    if (!dragging) {
      if (Math.abs(e.clientX - startX) < 6 && Math.abs(e.clientY - startY) < 6) return;
      if (Math.abs(e.clientY - startY) > Math.abs(e.clientX - startX)) { before = null; return; } // vertical scroll wins
      dragging = true; try { tr.setPointerCapture(pid); } catch (err) {}
    }
    e.preventDefault();
    setWeight(i, valueAt(e.clientX)); liveRefresh();
  });
  const end = e => {
    if (before == null) return;
    if (!dragging && e.type === 'pointerup') { setWeight(i, valueAt(e.clientX)); }   // tap to set
    const b = before; before = null; dragging = false;
    if (e.type !== 'pointercancel') { commit(b); render(); }
    else { Object.assign(S.sim, JSON.parse(b)); render(); }
  };
  tr.addEventListener('pointerup', end); tr.addEventListener('pointercancel', end);
}

function bindRadar(svg) {
  let active = null, before = null, pid = null;
  const toSvg = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  svg.addEventListener('pointerdown', e => {
    // handles can sit close together near the centre: take the nearest one
    const p = toSvg(e); let best = -1, bd = 1e9;
    M.cats.forEach((c, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / M.cats.length, r = RADAR_R * Math.min(catTotal(c, S.sim.w), RADAR_MAX) / RADAR_MAX;
      const d = Math.hypot(p.x - (180 + r * Math.cos(a)), p.y - (168 + r * Math.sin(a)));
      if (d < bd) { bd = d; best = i; }
    });
    if (best < 0 || bd > 34) return;
    const t = { dataset: { cat: best } };
    const c = M.cats[best];
    if (c.idx.every(j => S.sim.locks[j])) { toast('All weights in ' + c.label + ' are locked'); return; }
    active = +t.dataset.cat; before = snapshot(); pid = e.pointerId;
    try { svg.setPointerCapture(pid); } catch (err) {}
    e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    if (active == null || e.pointerId !== pid) return;
    e.preventDefault();
    const p = toSvg(e), n = M.cats.length, a = -Math.PI / 2 + active * 2 * Math.PI / n;
    const proj = (p.x - 180) * Math.cos(a) + (p.y - 168) * Math.sin(a);
    setCategory(M.cats[active], Math.max(0, proj) / RADAR_R * RADAR_MAX);
    liveRefresh();
  });
  const end = () => { if (active == null) return; const b = before; active = null; before = null; commit(b); render(); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
}

/* ---------- boot ---------- */
function fitHeight() {
  if (!LIVE) return;
  let h = 0;
  try { h = window.parent.innerHeight; } catch (e) {}
  if (!h) h = (window.screen && window.screen.availHeight) ? window.screen.availHeight - 60 : 700;
  ST.height(Math.max(480, h));
}

function onRender(args) {
  args = args || {};
  S.rendered = true;
  if (args.meta) initMeta(args.meta);
  S.needsSetup = !!args.needsSetup;
  const wasAuthed = S.authed;
  S.authed = !!args.authed;
  if (args.token) store.set('token', args.token);
  S.mailReady = !!args.mailReady; S.mailTo = args.mailTo || null;
  if (args.ack && args.ack === S.pendingId) {
    S.pendingId = null;
    if (S.authBusy) {
      S.authBusy = false;
      if (!S.authed) {
        if (S.authTried) S.authError = args.error || 'That code is not right.';
        else store.del('token');
        S.authTried = true;
      }
    }
    if (S.busy) { S.busy = false; S.runError = args.error || null; }
    if (S.mailBusy) { S.mailBusy = false; setTimeout(() => toast(args.error || args.notice || 'Sent'), 0); }
  }
  if (args.payload && args.payloadId && args.payloadId !== S.payloadId) {
    S.payload = args.payload; S.payloadId = args.payloadId;
    store.set('payload', args.payload);
    rememberRun(args.payload);
    if (S.tab === 'symbols') S.tab = 'ranking';
    S.detail = null;
  }
  if (!S.authed && !S.authBusy && !S.authTried && !S.needsSetup) {
    const tok = store.get('token', null);
    if (tok) { authWith({ token: tok }); return; }
    S.authTried = true;
  }
  if (S.authed && !wasAuthed && !S.payload) {
    const cached = store.get('payload', null);
    if (cached && cached.stocks) { S.payload = cached; S.tab = 'ranking'; }
  }
  render();
  fitHeight();
}

if (LIVE) {
  window.addEventListener('message', e => { const d = e.data; if (d && d.type === 'streamlit:render') onRender(d.args); });
  try { window.parent.addEventListener('resize', fitHeight); } catch (e) {}
  window.addEventListener('resize', fitHeight);
  ST.ready();
  fitHeight();
} else {
  initMeta(BOOT.meta);
  S.payload = BOOT.payload; S.authed = true;
  rememberRun(BOOT.payload);
  if (!store.get('tickers', null)) S.tickers = BOOT.payload.stocks.map(s => s.t);
  S.tab = 'ranking';
  render();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.detail) { S.detail = null; render(); } });
})();
</script>
